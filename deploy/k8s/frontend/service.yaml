# frontend — static Service manifest.
#
# Mirrors the Service in deploy/helm/banking-platform/templates/frontend.yaml.
# The Helm chart stays the GitOps source of truth (ArgoCD reconciles it);
# these files are for `kubectl apply`, review, and local clusters.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: banking
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: banking-platform
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
