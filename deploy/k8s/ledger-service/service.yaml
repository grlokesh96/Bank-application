# ledger-service — static Service manifest.
#
# Mirrors the Service in deploy/helm/banking-platform/templates/ledger-service.yaml.
# The Helm chart stays the GitOps source of truth (ArgoCD reconciles it);
# these files are for `kubectl apply`, review, and local clusters.
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: banking
  labels:
    app: ledger-service
    app.kubernetes.io/name: ledger-service
    app.kubernetes.io/part-of: banking-platform
spec:
  type: ClusterIP
  selector:
    app: ledger-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 9090
      targetPort: 9090
