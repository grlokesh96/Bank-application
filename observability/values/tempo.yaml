# Grafana Tempo (single-binary) — stores traces, receives OTLP from the collector.
tempo:
  retention: 24h
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

persistence:
  enabled: true
  size: 5Gi

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }
