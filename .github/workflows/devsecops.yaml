# ==============================================================================
# Banking Platform: DevSecOps CI/CD
# ------------------------------------------------------------------------------
# Services are discovered at runtime by .github/scripts/discover-services.sh.
#
# Stages
#   0   Discover services      dynamic matrices
#   1   Secrets scan           Gitleaks
#   2   Filesystem scan        Trivy (report only)
#   3   SAST                   Semgrep
#   4   SCA                    OWASP Dependency-Check
#   5   Dockerfile lint        Hadolint          (blocking)
#   6   SAST                   CodeQL            (blocking)
#   7   JS/TS lint             ESLint            (blocking)
#   8   Build                  Docker Buildx
#   9   Image scan and SBOM    Trivy + CycloneDX
#   10  Push                   Docker Hub, main only
#   11  Notify                 Slack summary, always runs
#
# Required secrets
#   DOCKERHUB_USERNAME, DOCKERHUB_PASSWORD         (required on main)
#
# Optional secrets
#   SLACK_WEBHOOK_URL                              enables Slack notification
#   SEMGREP_APP_TOKEN                              publishes Semgrep results
# ==============================================================================
name: DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/banking-platform
  HADOLINT_THRESHOLD: warning

jobs:
  # ---------------------------------------------------------------------------
  # 0. Discover services and build the matrices
  # ---------------------------------------------------------------------------
  discover-services:
    name: 0. Discover services
    runs-on: ubuntu-latest
    outputs:
      services_matrix: ${{ steps.discover.outputs.services_matrix }}
      node_matrix: ${{ steps.discover.outputs.node_matrix }}
      hadolint_matrix: ${{ steps.discover.outputs.hadolint_matrix }}
      codeql_matrix: ${{ steps.discover.outputs.codeql_matrix }}
      service_count: ${{ steps.discover.outputs.service_count }}
      services_list: ${{ steps.discover.outputs.services_list }}
    steps:
      - uses: actions/checkout@v4

      - id: discover
        run: .github/scripts/discover-services.sh

      # An empty or invalid matrix silently skips every downstream job,
      # so fail here with a clear message instead.
      - name: Validate matrices
        env:
          SERVICES: ${{ steps.discover.outputs.services_matrix }}
          NODE: ${{ steps.discover.outputs.node_matrix }}
          HADOLINT: ${{ steps.discover.outputs.hadolint_matrix }}
          CODEQL: ${{ steps.discover.outputs.codeql_matrix }}
        run: |
          status=0
          for var in SERVICES NODE HADOLINT CODEQL; do
            count=$(printf '%s' "${!var}" | jq -r '.include | length' 2>/dev/null || echo 0)
            echo "$var: $count entries"
            if [ "$count" -eq 0 ]; then
              echo "::error::$var is empty or invalid"
              status=1
            fi
          done
          exit "$status"

  # ---------------------------------------------------------------------------
  # 1 to 4. Security gates, run in sequence
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: 1. Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs-scan:
    name: 2. Filesystem scan (Trivy)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  sast-semgrep:
    name: 3. SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: trivy-fs-scan
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          generateSarif: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

  sca-owasp:
    name: 4. SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    needs: sast-semgrep
    steps:
      - uses: actions/checkout@v4
      - uses: dependency-check/Dependency-Check_Action@main
        with:
          project: Banking-Platform
          path: .
          format: HTML
          args: --failOnCVSS 9 --enableRetired
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: reports/

  # ---------------------------------------------------------------------------
  # 5 to 7. Lint and code analysis, one matrix job per target, blocking
  # ---------------------------------------------------------------------------
  hadolint:
    name: 5. Hadolint (${{ matrix.file }})
    runs-on: ubuntu-latest
    needs: [sca-owasp, discover-services]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-services.outputs.hadolint_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.file }}
          failure-threshold: ${{ env.HADOLINT_THRESHOLD }}
          config: .hadolint.yaml

  codeql:
    name: 6. CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: [sca-owasp, discover-services]
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-services.outputs.codeql_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version-file: go.work
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  eslint:
    name: 7. ESLint (${{ matrix.dir }})
    runs-on: ubuntu-latest
    needs: [sca-owasp, discover-services]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-services.outputs.node_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Lint
        working-directory: ${{ matrix.dir }}
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.lint ? 0 : 1)'; then
            npm run lint
          else
            npx --no-install eslint .
          fi

  # ---------------------------------------------------------------------------
  # 8 and 9. Build and image scan, one job per service
  # ---------------------------------------------------------------------------
  build:
    name: 8. Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [discover-services, hadolint, codeql, eslint]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-services.outputs.services_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build inputs
        id: inputs
        run: |
          sha="${GITHUB_SHA:0:12}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -f "${{ matrix.dir }}/Dockerfile" ]; then
            echo "context=${{ matrix.dir }}" >> "$GITHUB_OUTPUT"
            echo "dockerfile=${{ matrix.dir }}/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "build_args=" >> "$GITHUB_OUTPUT"
          else
            echo "context=." >> "$GITHUB_OUTPUT"
            echo "dockerfile=build/service.Dockerfile" >> "$GITHUB_OUTPUT"
            echo "build_args=SERVICE=${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.inputs.outputs.context }}
          file: ${{ steps.inputs.outputs.dockerfile }}
          build-args: ${{ steps.inputs.outputs.build_args }}
          tags: ${{ matrix.name }}:${{ steps.inputs.outputs.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Save image
        run: |
          docker save "${{ matrix.name }}:${{ steps.inputs.outputs.sha }}" \
            | gzip > "/tmp/${{ matrix.name }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: /tmp/${{ matrix.name }}.tar.gz
          retention-days: 7

  image-scan-sbom:
    name: 9. Image scan and SBOM (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [build, discover-services]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-services.outputs.services_matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: /tmp/img

      - name: Load image
        run: docker load -i "/tmp/img/${{ matrix.name }}.tar.gz"

      - name: Resolve image reference
        id: ref
        run: echo "image=${{ matrix.name }}:${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ref.outputs.image }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ref.outputs.image }}
          format: cyclonedx
          output: sbom-${{ matrix.name }}.cdx.json
          skip-setup-trivy: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 10. Push to Docker Hub, main only
  # ---------------------------------------------------------------------------
  push-dockerhub:
    name: 10. Push Docker Hub (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [image-scan-sbom, discover-services]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-services.outputs.services_matrix) }}
    steps:
      - name: Validate Docker Hub configuration
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_PASSWORD must both be set to push to Docker Hub"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: /tmp/img

      - name: Load image
        run: docker load -i "/tmp/img/${{ matrix.name }}.tar.gz"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Tag and push
        env:
          SERVICE: ${{ matrix.name }}
          REPO: ${{ env.DOCKERHUB_REPO }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA:0:12}"
          src="${SERVICE}:${sha}"

          docker tag "$src" "$REPO:${SERVICE}-${sha}"
          docker tag "$src" "$REPO:${SERVICE}-latest"
          docker push "$REPO:${SERVICE}-${sha}"
          docker push "$REPO:${SERVICE}-latest"

          {
            echo "### Pushed ${SERVICE} to Docker Hub"
            echo ""
            echo "- \`$REPO:${SERVICE}-${sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 11. Slack notification, always runs
  # ---------------------------------------------------------------------------
  notify:
    name: 11. Slack notification
    runs-on: ubuntu-latest
    if: always()
    needs:
      - discover-services
      - secrets-scan
      - trivy-fs-scan
      - sast-semgrep
      - sca-owasp
      - hadolint
      - codeql
      - eslint
      - build
      - image-scan-sbom
      - push-dockerhub
    steps:
      - name: Compute pipeline status
        id: status
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure")' >/dev/null; then
            echo "value=failed" >> "$GITHUB_OUTPUT"
          elif echo "$RESULTS" | jq -e 'any(.[]; .result == "cancelled")' >/dev/null; then
            echo "value=cancelled" >> "$GITHUB_OUTPUT"
          else
            echo "value=passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack message
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ steps.status.outputs.value }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::SLACK_WEBHOOK_URL not set, skipping Slack"
            exit 0
          fi
          text="*Pipeline ${STATUS}*: \`${{ github.repository }}\` (\`${{ github.ref_name }}\`)\n<${RUN_URL}|View run>"
          jq -n --arg text "$(printf '%b' "$text")" '{text: $text}' \
            | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK" \
            || echo "::warning::Slack notification failed"
