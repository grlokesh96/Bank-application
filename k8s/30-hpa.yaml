# Banking Platform — horizontal pod autoscalers
#
# One HPA per workload, all scaling on CPU utilisation. The HPAs require
# a metrics server (metrics-server on kind, or the EKS metrics server
# add-on) — without it they stay <unknown> and the replicas field is
# simply ignored.
#
# api-gateway and frontend scale on CPU only; the microservices scale on
# CPU and memory.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: account-service-hpa
  namespace: banking
  labels:
    app: account-service
    app.kubernetes.io/part-of: banking-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: account-service-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
