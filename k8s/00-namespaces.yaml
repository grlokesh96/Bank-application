
# Banking Platform — namespaces and shared configuration
#
# Namespaces:
#   banking       — banking platform workloads and datastores
#   observability — monitoring and tracing stack, installed separately
#
# Shared ConfigMaps centralize common environment variables.
# Reference them from Deployments using envFrom.
#
# IMPORTANT:
# Store passwords, tokens, and other credentials in Kubernetes Secrets
# or an external secrets manager, not in ConfigMaps.

---
apiVersion: v1
kind: Namespace
metadata:
  name: banking
  labels:
    app.kubernetes.io/part-of: banking-platform

---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: banking-platform

---
# Common settings for backend services.
# Override service-specific values in individual Deployments when needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-platform-config
  namespace: banking
  labels:
    app.kubernetes.io/part-of: banking-platform
data:
  ENVIRONMENT: "development"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  HTTP_PORT: "8080"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.observability.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_INSECURE: "true"

---
# Shared datastore and message-broker settings.
# Only services that require these dependencies should reference this ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-platform-datastores
  namespace: banking
  labels:
    app.kubernetes.io/part-of: banking-platform
data:
  POSTGRES_ENABLED: "true"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "banking"
  POSTGRES_SSLMODE: "disable"
  REDIS_ENABLED: "true"
  REDIS_ADDR: "redis:6379"
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: "kafka:9092"
