# Observability wiring for the Banking Platform.
#
# The Prometheus Operator (kube-prometheus-stack) must already be installed in
# the cluster. These objects are what make the platform's metrics visible:
#
#   * banking-platform-services — scrapes /metrics from every service in the
#     banking namespace. All Go services expose the Prometheus middleware
#     metrics (http_requests_total, http_request_duration_seconds, plus Go
#     runtime metrics) on their http port.
#   * otel-collector — scrapes the OpenTelemetry Collector's Prometheus
#     exporter, which carries the OTLP metrics produced by the services.
#
# The two ConfigMaps hold Grafana dashboard JSON. They are labelled
# `grafana_dashboard: "1"` so the Grafana sidecar picks them up and serves
# them automatically. They are plain dashboards - applying them does not
# install Grafana.

# Scrapes /metrics from every banking-platform service. All services expose the
# Prometheus middleware metrics (http_requests_total, http_request_duration, and
# Go runtime metrics) on the http port at /metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: banking-platform-services
  namespace: banking
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: ["banking"]
  selector:
    matchLabels:
      app.kubernetes.io/part-of: banking-platform
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
# Scrape the OTel Collector's Prometheus exporter (OTLP metrics from services).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: ["observability"]
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  endpoints:
    - port: prom-export
      path: /metrics
      interval: 30s

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-services-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  banking-services.json: |
    {
      "title": "Banking Platform — Services",
      "uid": "banking-services",
      "schemaVersion": 39,
      "editable": true,
      "time": { "from": "now-30m", "to": "now" },
      "templating": { "list": [] },
      "panels": [
        {
          "type": "timeseries",
          "title": "Request rate (req/s) by service",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum by (service) (rate(http_requests_total[5m]))", "legendFormat": "{{service}}" }
          ]
        },
        {
          "type": "timeseries",
          "title": "p95 latency (s) by service",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket[5m])))", "legendFormat": "{{service}}" }
          ]
        },
        {
          "type": "timeseries",
          "title": "5xx error rate by service",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "expr": "sum by (service) (rate(http_requests_total{status=~\"5..\"}[5m]))", "legendFormat": "{{service}}" }
          ]
        },
        {
          "type": "stat",
          "title": "Total requests (last 5m)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            { "expr": "sum(increase(http_requests_total[5m]))", "legendFormat": "requests" }
          ]
        }
      ]
    }

---
# Per-service Grafana dashboard. Pick a service from the `service` dropdown to
# see: running pods, request rate/status, latency, CPU, memory, and live Loki
# logs — all filtered to that one service. Provisioned via the grafana sidecar
# (label grafana_dashboard), so it survives Grafana restarts (Grafana has no PVC).
apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-service-detail-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  banking-service-detail.json: |
    {
      "title": "Banking — Service Detail (per service)",
      "uid": "banking-service-detail",
      "schemaVersion": 39,
      "editable": true,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Service",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(up{namespace=\"banking\"}, service)",
            "query": { "qryType": 1, "query": "label_values(up{namespace=\"banking\"}, service)", "refId": "StandardVariableQuery" },
            "refresh": 2,
            "sort": 1,
            "includeAll": false,
            "multi": false,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Running pods",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "count(up{namespace=\"banking\", service=\"$service\"} == 1)" } ]
        },
        {
          "id": 2, "type": "stat", "title": "Request rate (req/s)",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps", "decimals": 2 } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(rate(http_requests_total{namespace=\"banking\", service=\"$service\"}[5m]))" } ]
        },
        {
          "id": 3, "type": "stat", "title": "p95 latency",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 3 } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"banking\", service=\"$service\"}[5m])) by (le))" } ]
        },
        {
          "id": 4, "type": "stat", "title": "5xx errors (req/s)",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps", "decimals": 2, "color": { "mode": "thresholds" }, "thresholds": { "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 0.001 } ] } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(rate(http_requests_total{namespace=\"banking\", service=\"$service\", status=~\"5..\"}[5m]))" } ]
        },
        {
          "id": 5, "type": "timeseries", "title": "Request rate by status",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "drawStyle": "line", "fillOpacity": 15, "stacking": { "mode": "normal" } } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum by (status) (rate(http_requests_total{namespace=\"banking\", service=\"$service\"}[5m]))", "legendFormat": "{{status}}" } ]
        },
        {
          "id": 6, "type": "timeseries", "title": "Latency (p50 / p95 / p99)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{namespace=\"banking\", service=\"$service\"}[5m])) by (le))", "legendFormat": "p50" },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"banking\", service=\"$service\"}[5m])) by (le))", "legendFormat": "p95" },
            { "refId": "C", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=\"banking\", service=\"$service\"}[5m])) by (le))", "legendFormat": "p99" }
          ]
        },
        {
          "id": 7, "type": "timeseries", "title": "CPU usage per pod (cores)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 3 } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"banking\", pod=~\"$service-deployment-.*\", container!=\"\", container!=\"POD\"}[5m]))", "legendFormat": "{{pod}}" } ]
        },
        {
          "id": 8, "type": "timeseries", "title": "Memory working set per pod",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"banking\", pod=~\"$service-deployment-.*\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{pod}}" } ]
        },
        {
          "id": 9, "type": "logs", "title": "Live logs (Loki)",
          "gridPos": { "h": 11, "w": 24, "x": 0, "y": 20 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true },
          "targets": [ { "refId": "A", "datasource": { "type": "loki", "uid": "loki" }, "expr": "{namespace=\"banking\", app=\"$service\"}" } ]
        }
      ]
    }
