# Banking Platform — shared Secret (EXAMPLE — do not apply as-is)
#
# Every service reads the same four credentials from one Secret named
# `banking-platform-secrets`.
#
# This file is a TEMPLATE. The placeholder values below are not
# credentials. Create the real Secret out-of-band so that no secret is
# ever committed to Git:
#
#   kubectl -n banking create secret generic banking-platform-secrets \
#     --from-literal=POSTGRES_USER=... \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=JWT_SECRET=... \
#     --from-literal=JWT_ISSUER=...
#
# For a throwaway local cluster you can apply this file as-is, but never
# do that anywhere that matters.
---
apiVersion: v1
kind: Secret
metadata:
  name: banking-platform-secrets
  namespace: banking
  labels:
    app.kubernetes.io/part-of: banking-platform
type: Opaque
stringData:
  POSTGRES_USER: "<replace-me>"
  POSTGRES_PASSWORD: "<replace-me>"
  JWT_SECRET: "<replace-me>"
  JWT_ISSUER: "banking-platform"
